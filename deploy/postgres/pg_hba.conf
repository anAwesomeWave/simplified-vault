# Общий pg_hba.conf обоих узлов secrets_db (primary и standby).
# Лежит вне каталога данных, поэтому одинаков после клонирования и смены ролей.
# Локальный сокет доступен только внутри контейнера: им пользуются
# инициализация образа и служебные скрипты (scripts/db.sh, backup.sh).
local   all           all                 trust
local   replication   all                 trust
# Приложение и соседний узел подключаются по сети secrets-db с паролем.
host    all           all           all   scram-sha-256
host    replication   all           all   scram-sha-256
