name: simple-vault-gateway

services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    environment:
      HTTP_ADDR: ":8000"
      AUTH_URL: "${AUTH_URL:-http://auth:8000}"
      SECRETS_URL: "${SECRETS_URL:-http://secrets:8000}"
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      LOGIN_REQUESTS_PER_MINUTE: "${LOGIN_REQUESTS_PER_MINUTE:-5}"
    secrets: [jwt_public_key]
    networks: [backend]
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    restart: unless-stopped

networks:
  backend:
    external: true
    name: "${BACKEND_NETWORK:-simple-vault_default}"

secrets:
  jwt_public_key:
    file: "${JWT_PUBLIC_KEY_PATH:-./.secrets/jwt_public_key}"
