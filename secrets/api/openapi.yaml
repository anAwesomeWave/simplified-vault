openapi: 3.0.3
info:
  title: Secrets API
  version: 1.0.0
  description: |
    Внутренний контракт gateway → secrets. Внешний API gateway проверяет подпись RS256
    и срок действия JWT. X-User-ID берётся из claim user_id, X-User-Email из claim email,
    X-Real-IP из адреса клиента. При неверном JWT или обязательных claims gateway
    отвечает 401, не передавая запрос в сервис. После проверки gateway
    удаляет клиентские X-User-ID, X-User-Email, X-Real-IP и устанавливает их заново
    из проверенной личности и IP клиента. Gateway передаёт только аутентифицированную
    личность; доверять присланным клиентом значениям этих заголовков запрещено.
    Все восемь операций требуют ровно один X-User-ID и ровно один X-User-Email.
    Отсутствие, неверный формат и дубликаты дают 401 gateway_identity_required.
    X-User-ID — ненулевой канонический UUID в нижнем регистре;
    X-User-Email — простой email без отображаемого имени, не более 320 байт.
    Сервис JWT не проверяет и игнорирует Authorization. X-Real-IP используется для аудита:
    допустим один IPv4/IPv6 literal без порта, списка и зоны интерфейса.
    Отсутствующий, некорректный или дублированный X-Real-IP заменяется IP прямого соединения.
    В рабочей среде доступ к сервису разрешён только доверенному gateway;
    loopback-порт Compose предназначен для локальной отладки.
    Текст шифруется AES-256-GCM и не включается в события или списки.
    Временные метки — RFC 3339 UTC, идентификаторы — UUID.
servers:
  - url: /
security:
  - userID: []
    userEmail: []
tags:
  - name: secrets
  - name: access
paths:
  /secrets:
    post:
      operationId: createSecret
      tags: [secrets]
      summary: Создать секрет
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, text]
              properties:
                title:
                  type: string
                  description: Название хранится открыто и попадает в письма. Не включайте чувствительные данные.
                text:
                  type: string
                  description: Не более 10240 байт UTF-8. После создания не редактируется.
                ttl_seconds:
                  type: integer
                  minimum: 300
                  maximum: 604800
                  default: 86400
      responses:
        '201':
          description: Секрет создан
          content:
            application/json:
              schema:
                type: object
                required: [id, link, expires_at]
                properties:
                  id: {$ref: '#/components/schemas/UUID'}
                  link: {type: string, format: uri}
                  expires_at: {$ref: '#/components/schemas/Timestamp'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InfrastructureError'}
    get:
      operationId: listOwnedSecrets
      tags: [secrets]
      summary: Список своих активных секретов
      responses:
        '200':
          description: Активные секреты текущего автора, пустой список — []
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, expires_at, pending_requests]
                  properties:
                    id: {$ref: '#/components/schemas/UUID'}
                    title: {type: string}
                    expires_at: {$ref: '#/components/schemas/Timestamp'}
                    pending_requests: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InfrastructureError'}
  /secrets/shared:
    get:
      operationId: listSharedSecrets
      tags: [secrets]
      summary: Секреты, к которым мне одобрен доступ
      responses:
        '200':
          description: Только неистёкшие секреты с действующим одобренным доступом, пустой список — []
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, owner_email, expires_at]
                  properties:
                    id: {$ref: '#/components/schemas/UUID'}
                    title: {type: string}
                    owner_email: {type: string, format: email}
                    expires_at: {$ref: '#/components/schemas/Timestamp'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/InfrastructureError'}
  /secrets/{id}:
    parameters:
      - $ref: '#/components/parameters/SecretID'
    get:
      operationId: readSecret
      tags: [secrets]
      summary: Открыть секрет или автоматически запросить доступ
      parameters:
        - $ref: '#/components/parameters/ClientIP'
      description: |
        Автор и получатель с approved получают текст. Первая попытка другого пользователя
        атомарно создаёт один pending-запрос и событие access.requested.
        Повторные попытки pending не создают новых запросов или событий.
        denied и revoked навсегда возвращают 403; повторный запрос невозможен.
        Каждое успешное открытие сохраняет просмотр и публикует secret.viewed, включая открытие автором.
        Истёкший секрет всегда возвращает 404, независимо от фонового удаления и кэша.
      responses:
        '200':
          description: Секрет доступен
          content:
            application/json:
              schema:
                type: object
                required: [id, title, text, expires_at]
                properties:
                  id: {$ref: '#/components/schemas/UUID'}
                  title: {type: string}
                  text: {type: string}
                  expires_at: {$ref: '#/components/schemas/Timestamp'}
        '202':
          description: Ожидается решение автора
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [pending]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InfrastructureError'}
    delete:
      operationId: revokeSecret
      tags: [secrets]
      summary: Автор отзывает секрет
      description: |
        Секрет удаляется сразу вместе с запросами и историей просмотров.
        Событие access.revoked содержит email только пользователей с approved-доступом.
        Пользователи с pending, denied и revoked уведомление не получают.
      responses:
        '204': {description: Секрет удалён, тело отсутствует}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InfrastructureError'}
  /secrets/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/SecretID'
    get:
      operationId: listRequestsAndViews
      tags: [access]
      summary: Автор получает запросы и историю открытий
      responses:
        '200':
          description: История запросов и открытий, включая закрытый и отклонённый доступ
          content:
            application/json:
              schema:
                type: object
                required: [requests, views]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      required: [id, requester_email, status, created_at]
                      properties:
                        id: {$ref: '#/components/schemas/UUID'}
                        requester_email: {type: string, format: email}
                        status: {$ref: '#/components/schemas/AccessStatus'}
                        created_at: {$ref: '#/components/schemas/Timestamp'}
                  views:
                    type: array
                    items:
                      type: object
                      required: [email, ip, viewed_at]
                      properties:
                        email: {type: string, format: email}
                        ip: {type: string}
                        viewed_at: {$ref: '#/components/schemas/Timestamp'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InfrastructureError'}
  /secrets/{id}/requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/SecretID'
      - name: request_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
    post:
      operationId: decideAccessRequest
      tags: [access]
      summary: Автор одобряет или отклоняет pending-запрос
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, deny]}
      responses:
        '200':
          description: Решение сохранено
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status]
                properties:
                  request_id: {$ref: '#/components/schemas/UUID'}
                  status: {type: string, enum: [approved, denied]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Запрос уже рассмотрен; решение изменить нельзя
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/InfrastructureError'}
  /secrets/{id}/access/{user_id}:
    parameters:
      - $ref: '#/components/parameters/SecretID'
      - name: user_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
    delete:
      operationId: revokeUserAccess
      tags: [access]
      summary: Автор закрывает одобренный доступ одному пользователю
      description: Запрос переходит approved → revoked; последующие чтения пользователя получают 403.
      responses:
        '204': {description: Доступ закрыт, тело отсутствует}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/InfrastructureError'}
components:
  securitySchemes:
    userID:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        Обязателен ровно один ненулевой UUID в каноническом виде
        xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx, нижний регистр.
        Gateway удаляет клиентское значение и устанавливает ID проверенной личности.
        Отсутствие, неверный формат или дубликат — 401 gateway_identity_required.
    userEmail:
      type: apiKey
      in: header
      name: X-User-Email
      description: |
        Обязателен ровно один простой email без отображаемого имени, до 320 байт.
        Gateway удаляет клиентское значение и устанавливает email проверенной личности.
        Отсутствие, неверный формат или дубликат — 401 gateway_identity_required.
  parameters:
    ClientIP:
      name: X-Real-IP
      in: header
      required: false
      description: |
        Gateway удаляет клиентское значение и передаёт один IPv4/IPv6 literal
        без порта, списка адресов и зоны интерфейса для истории открытий.
        Если заголовок отсутствует, некорректен или дублирован, используется IP прямого соединения.
      schema:
        type: string
      example: '2001:db8::42'
    SecretID:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  schemas:
    UUID: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    AccessStatus: {type: string, enum: [pending, approved, denied, revoked]}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string, description: Машиночитаемый код ошибки}
        message: {type: string, description: Описание без секретов и внутренних ошибок}
    Event:
      type: object
      required: [event_id, type, occurred_at, secret_id]
      description: |
        AMQP JSON; topic exchange app.events; routing key совпадает с type.
        Durable-очередь notification.events, persistent-сообщения.
        Доставка как минимум один раз: потребитель дедуплицирует по event_id.
        Текст секрета, ciphertext, nonce и JWT отсутствуют во всех событиях.
      properties:
        event_id: {$ref: '#/components/schemas/UUID'}
        type:
          type: string
          enum: [secret.created, access.requested, access.decided, secret.viewed, access.revoked]
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        secret_id: {$ref: '#/components/schemas/UUID'}
        owner_id: {$ref: '#/components/schemas/UUID'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        title: {type: string}
        request_id: {$ref: '#/components/schemas/UUID'}
        requester_email: {type: string, format: email}
        owner_email: {type: string, format: email}
        decision: {type: string, enum: [approve, deny]}
        viewer_email: {type: string, format: email}
        ip: {type: string}
        user_emails:
          type: array
          items: {type: string, format: email}
      x-required-by-type:
        secret.created: [secret_id, owner_id, expires_at]
        access.requested: [secret_id, title, request_id, requester_email, owner_email]
        access.decided: [secret_id, title, decision, requester_email]
        secret.viewed: [secret_id, title, viewer_email, owner_email, ip]
        access.revoked: [secret_id, title, user_emails]
  responses:
    BadRequest:
      description: Некорректный JSON, текст или TTL
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: X-User-ID или X-User-Email отсутствует, пуст, некорректен или дублирован
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: gateway_identity_required
            message: Отсутствуют или некорректны данные пользователя
    Forbidden:
      description: Действие разрешено только автору либо доступ пользователя отклонён или закрыт
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Некорректный UUID, секрет не существует или истёк, запрос не найден либо одобренного доступа нет
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InfrastructureError:
      description: Внутренняя ошибка (500), отмена запроса (503) или таймаут (504)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
