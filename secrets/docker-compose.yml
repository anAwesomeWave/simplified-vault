name: simple-vault

services:
  secrets:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      HTTP_ADDR: ":8000"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: secrets
      POSTGRES_DB: secrets_db
      POSTGRES_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_ADDR: redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: secrets
      RABBITMQ_VHOST: /
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [master_key, postgres_password, rabbitmq_password]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/secrets", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    stop_grace_period: 25s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: secrets
      POSTGRES_DB: secrets_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-secrets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrets -d secrets_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        password=$$(cat /run/secrets/rabbitmq_password)
        case "$$password" in ''|*[!a-fA-F0-9]*) exit 1 ;; esac
        printf 'default_user = secrets\ndefault_pass = %s\n' "$$password" > /etc/rabbitmq/secrets.conf
        unset password
        chown rabbitmq:rabbitmq /etc/rabbitmq/secrets.conf
        export RABBITMQ_CONFIG_FILE=/etc/rabbitmq/secrets.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-secrets-data: {}
  rabbitmq-data: {}

secrets:
  master_key:
    file: ./.secrets/master_key
  postgres_password:
    file: ./.secrets/postgres_password
  rabbitmq_password:
    file: ./.secrets/rabbitmq_password
